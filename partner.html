<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>TexCom – Partner</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <style>
        /* Partner display: the last spoken phrase, as large as the screen allows. Works offline. */
        html, body {
            margin: 0;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
        }
        #stage {
            box-sizing: border-box;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(4vmin, env(safe-area-inset-top)) max(4vmin, env(safe-area-inset-right))
                     max(4vmin, env(safe-area-inset-bottom)) max(4vmin, env(safe-area-inset-left));
        }
        #phrase {
            width: 100%; /* full width so long phrases wrap onto more lines instead of shrinking */
            max-width: 100%;
            max-height: 100%;
            text-align: center;
            font-weight: 600;
            line-height: 1.15;
            overflow-wrap: break-word;
            transition: opacity 0.2s ease;
        }
        #phrase.waiting { color: #777; font-weight: 400; }
    </style>
</head>
<body>
    <div id="stage"><div id="phrase" class="waiting" role="status" aria-live="polite">Waiting for a message…</div></div>
    <script>
        const phraseEl = document.getElementById('phrase');
        const stage = document.getElementById('stage');

        // Largest font size at which the phrase still fits the screen
        function fit() {
            const cs = getComputedStyle(stage);
            const maxH = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
            let lo = 16, hi = 600;
            phraseEl.style.overflowWrap = 'normal'; // measure with whole words, so a word split across lines doesn't count as fitting
            while (hi - lo > 1) {
                const mid = (lo + hi) / 2;
                phraseEl.style.fontSize = mid + 'px';
                // fits if it isn't taller than the screen and no single word is wider than it
                if (phraseEl.scrollHeight <= maxH && phraseEl.scrollWidth <= phraseEl.clientWidth + 1) lo = mid; else hi = mid;
            }
            phraseEl.style.fontSize = lo + 'px';
            phraseEl.style.overflowWrap = lo <= 16 ? 'anywhere' : 'normal';
        }

        // Called by the app (native partner screens) or by messages from the main window (web)
        let lastShown = '', lastShownAt = 0;
        function showPhrase(text) {
            text = (text || '').trim();
            if (!text) return;
            // In the apps a phrase can arrive twice (from the app and over the channel): show it once
            const now = Date.now();
            if (text === lastShown && now - lastShownAt < 1000) return;
            lastShown = text; lastShownAt = now;
            phraseEl.classList.remove('waiting');
            phraseEl.style.opacity = 0;
            setTimeout(() => { phraseEl.textContent = text; fit(); phraseEl.style.opacity = 1; }, 120);
        }
        window.showPhrase = showPhrase;

        // Web: the main TexCom window sends phrases over a BroadcastChannel (same browser, no network)
        if ('BroadcastChannel' in window) {
            const channel = new BroadcastChannel('texcom-partner');
            channel.onmessage = (e) => { if (e.data && e.data.type === 'spoken') showPhrase(e.data.text); };
            channel.postMessage({ type: 'hello' }); // ask for the phrase already spoken
        }
        try { const last = localStorage.getItem('texcomPartnerLast'); if (last) showPhrase(last); } catch (e) {}

        new ResizeObserver(fit).observe(stage); // any size change: window, rotation, on-screen keyboard
        fit();
    </script>
</body>
</html>
